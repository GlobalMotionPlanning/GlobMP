# Stage 2 (Latent Diffusion Policy) on XHand teleop: train_latent_diffusion_unet_real_image_workspace with
#   task=xhand_ldp, at=at_xhand, 180x320 images, seed 1000, a step budget (training.max_steps) matching the
#   bench's DP recipe, wandb disabled, no extra top-k checkpoint copy. dataloader.batch_size is PER PROCESS
#   (the launcher splits the recipe total across GPUs) and the learning rate is NOT multiplied by the GPU
#   count (scale_lr_by_num_gpus: False), so the total batch / lr are those of a 1-GPU run.
defaults:
  - task: xhand_ldp
  - at: at_xhand
  - _self_

name: train_latent_diffusion_unet_image
_target_: reactive_diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: ${at.horizon}
n_obs_steps: ${at.n_obs_steps}
n_latency_steps: 0
obs_temporal_downsample_ratio: 2
dataset_obs_steps: ${eval:'${at.n_obs_steps}*${at.dataset_obs_temporal_downsample_ratio}'}
dataset_obs_temporal_downsample_ratio: ${at.dataset_obs_temporal_downsample_ratio}
n_action_steps: ${eval:'${horizon}-${dataset_obs_steps}+1'}
past_action_visible: False
keypoint_visible_rate: 1.0

at_load_dir: ???   # stage-1 checkpoint (.../checkpoints/latest.ckpt)
use_latent_action_before_vq: False
obs_as_global_cond: True

policy:
  _target_: reactive_diffusion_policy.policy.latent_diffusion_unet_image_policy.LatentDiffusionUnetImagePolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  obs_encoder:
    _target_: reactive_diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: reactive_diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: [180, 320]
    random_transforms:
      - type: RandomCrop
        ratio: 0.90
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  use_latent_action_before_vq: ${use_latent_action_before_vq}
  at:
    _target_: reactive_diffusion_policy.model.vae.model.VAE
    shape_meta: ${shape_meta}
    horizon: ${at.policy.horizon}
    n_latent_dims: ${at.policy.n_latent_dims}
    mlp_layer_num: ${at.policy.mlp_layer_num}
    use_conv_encoder: ${at.policy.use_conv_encoder}
    conv_latent_dims: ${at.policy.conv_latent_dims}
    conv_layer_num: ${at.policy.conv_layer_num}
    use_rnn_decoder: ${at.policy.use_rnn_decoder}
    rnn_latent_dims: ${at.policy.rnn_latent_dims}
    rnn_layer_num: ${at.policy.rnn_layer_num}
    use_vq: ${at.policy.use_vq}
    n_embed: ${at.policy.n_embed}
    vqvae_groups: ${at.policy.vqvae_groups}
    eval: true
    load_dir: ${at_load_dir}
    act_scale: ${at.policy.act_scale}

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5 # dummy, overridden by the latent policy
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: reactive_diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 64
  num_workers: 0
  shuffle: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6
  encoder_weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 1000
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 401          # ignored when max_steps is set
  max_steps: 10000
  scale_lr_by_num_gpus: False
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  rollout_every: 50
  checkpoint_every: 10
  val_every: 1
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 10.0
  layer_decay: 1.0
  encoder_lr_coefficient: 0.1

logging:
  project: latent_diffusion_policy_tactile
  resume: True
  mode: disabled
  name: ${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 0
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
