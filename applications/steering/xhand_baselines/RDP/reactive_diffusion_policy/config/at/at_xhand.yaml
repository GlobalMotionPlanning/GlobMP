# at_wipe_lift with every width x4 for 38-D actions (theirs: 8-D bimanual / 4-10-D single arm): per latent step
# 32 dims for 4 x 38 action values (theirs 8 for 4 x 8); diffused latent 8 x 32.
horizon: 32
n_obs_steps: 2
dataset_obs_temporal_downsample_ratio: 2

policy:
  horizon: ${horizon}
  n_latent_dims: 32
  mlp_layer_num: 1
  use_conv_encoder: True
  conv_latent_dims: 128
  conv_layer_num: 1
  use_rnn_decoder: True
  rnn_latent_dims: 128
  rnn_layer_num: 1
  kl_multiplier: 1e-6 # keep it small for non-strict regularization
  n_embed: 32
  # ==============
  use_vq: False
  vqvae_groups: 4
  eval: false
  act_scale: 1
