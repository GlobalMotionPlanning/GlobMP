# XHand bimanual teleop (LeRobot v3), Asymmetric Tokenizer stage.
# 38-D joint targets [L_arm 7 | L_hand 12 | R_arm 7 | R_hand 12]; 30-D fingertip force
# (2 hands x 5 fingertips x 3 axes) is the fast signal, used like the wrench in real_lift_image_wrench_*.
name: xhand_at

image_shape: [3, 180, 320]   # 640x360 videos halved, aspect kept (RDP halves 640x480 to 320x240)
dataset_path: ???            # <XB_ROOT>/data/<task>/lerobot
episodes: ???                # <XB_ROOT>/data/<task>/split/train.json
# RDP predicts the TCP trajectory relative to the current pose and keeps the gripper width absolute; in joint
# space: arm joints relative to the current state (action - state[t], obs state - state[t]), hand joints absolute.
relative_action_dims: [0, 1, 2, 3, 4, 5, 6, 19, 20, 21, 22, 23, 24, 25]

shape_meta: &shape_meta
  obs:
    state:
      shape: [38]
      type: low_dim
    tactile:
      shape: [30]
      type: low_dim
  extended_obs: # for the AT RNN decoder
    tactile:
      shape: [30]
      type: low_dim
  action:
    shape: [38]

dataset:
  _target_: reactive_diffusion_policy.dataset.xhand_lerobot_dataset.XHandLeRobotDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  episodes: ${task.episodes}
  horizon: ${horizon}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  relative_action_dims: ${task.relative_action_dims}
  val_ratio: 0.0
